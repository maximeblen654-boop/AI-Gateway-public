:nowrap;min-height:36px}.warn{background:#fcf0e6;color:#97603c;border-color:#efddcd}.status i{font-style:normal;margin-right:5px}.row{display:flex;align-items:center;gap:18px;position:relative}.detail{margin-top:14px;border-top:1px solid #e6e0d7;padding-top:14px;font-size:12px;color:#81786f}.detail strong{color:#514b43;font-weight:600}.detail p{margin:4px 0}.detail[hidden]{display:none}.foot{margin-top:16px;color:#94897d;font-size:11px}.picked{color:#845c43;font-size:12px;margin-top:10px;min-height:20px}.caption{margin-top:30px;font-size:12px;color:#94897d}.dark{background:#211f1c;color:#eee9e1}.dark .top{border-color:#3e3932}.dark .panel,.dark .composer{background:#2b2824;border-color:#484037}.dark .quiet,.dark .meta,.dark .intro p,.dark .model small,.dark .detail{color:#b3a797}.dark .status{background:#37322d;border-color:#4b4339;color:#cbbfb0}.dark .warn{background:#49382b;color:#edb590}.dark .detail{border-color:#484037}.dark .detail strong{color:#ede3d6}.dark .chip{border-color:#4b4339}.dark .selected{background:#39312a!important;border-color:#67513f!important}.dark .theme{border-color:#52473c}.dark .picked{color:#d9ac86}@media(max-width:600px){.top{padding:0 19px;height:58px}.stage{padding:30px 16px;min-height:780px}.intro h1{font-size:22px}.intro{margin-bottom:24px}.composer{padding:18px 15px}.row{gap:10px}.status{font-size:11px;padding:6px 8px}.caption{margin-top:20px}.model strong{font-size:13px}}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .18s ease-out}.status,.model,.tile{transition:background .14s,transform .14s}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><div class="top"><div class="brand"><b>G</b>AI Gateway <span class="quiet"> / 文生图</span></div><button class="theme">浅色 / 深色</button></div><main class="stage"><header class="intro"><h1>让想法有画面。</h1><p>选一个模型，开始新的创作。</p></header><style>.panel{padding:23px 26px}.head{margin-bottom:12px}.row{padding:14px 4px;border-top:1px solid #e5dfd7}.bar-status{border:0;background:transparent;min-width:110px;padding:8px 0 8px 12px;font-size:11px;color:#887a6a;text-align:left}.bar-status>span:last-child{display:flex;justify-content:space-between;margin-top:7px}.bar-status b{font-weight:400}.bar{height:7px;display:block;border-radius:4px;background:repeating-linear-gradient(to right,#dcd5ca 0 7px,transparent 7px 10px)}.observed{background:#d6ddcd;overflow:hidden}.observed i{height:7px;width:12%;display:block;background:#bb7751}.selected .model strong:before{content:"✓ ";color:#987150}.dark .row{border-color:#443d34}.dark .bar-status{color:#c9b59d}@media(max-width:600px){.panel{padding:20px 17px}.bar-status{min-width:94px}.row{gap:7px}}</style><section class="panel"><div class="head"><strong>选择创作模型</strong><span class="meta">近 90 分钟</span></div><div class="row selected"><button class="model" data-select="0"><strong>GPT Image 2</strong><small>1K / 2K / 4K · 5 种比例</small></button><button class="bar-status" data-status="0"><span class="bar observed"><i></i></span><span>错误 12% <b>⌄</b></span></button></div><div class="row "><button class="model" data-select="1"><strong>Nano-banana-2.1</strong><small>可售规格随商品配置</small></button><button class="bar-status" data-status="1"><span class="bar "><i></i></span><span>样本不足 <b>⌄</b></span></button></div><div class="row "><button class="model" data-select="2"><strong>GPT Image 2 · 高清</strong><small>4K · 2 种比例</small></button><button class="bar-status" data-status="2"><span class="bar "><i></i></span><span>暂无数据 <b>⌄</b></span></button></div><section class="detail" id="detail" hidden aria-live="polite"><strong id="detail-title"></strong><p id="detail-message"></p><p>范围：当前分组、同平台及同模型的汇总，不代表具体渠道。</p><p>最近 90 分钟 · 数据截至 10:30 · 更新于 10:31</p></section><div class="foot">短条表示统计比例，不是实时状态或时间趋势</div></section><div class="picked" role="status"></div><div class="composer"><div class="prompt">写下你想看到的画面…</div><div class="bottom"><button class="chip">□ 1:1 ⌄</button><button class="chip">2K ⌄</button><button class="chip">1 张 ⌄</button><button class="generate" disabled>开始生成 ↑</button></div></div><p class="caption">状态来自已有调用记录；模型选择后仍由服务端重新报价。</p></main><script>const data=[["GPT Image 2", "1K / 2K / 4K · 5 种比例", "错误 12%", "warn", "已记录请求错误率 12%。不等同于作品交付失败率。"], ["Nano-banana-2.1", "可售规格随商品配置", "样本不足", "", "样本不足，暂不展示错误率。"], ["GPT Image 2 · 高清", "4K · 2 种比例", "暂无数据", "", "当前没有可用于判断的统计数据。"]];document.querySelector('.theme').onclick=()=>document.body.classList.toggle('dark');document.querySelectorAll('[data-status]').forEach(el=>{const show=()=>{const d=data[+el.dataset.status];document.querySelector('#detail').hidden=false;document.querySelector('#detail-title').textContent=d[0]+' · '+d[2];document.querySelector('#detail-message').textContent=d[4];};el.onclick=show;el.onfocus=show;el.onmouseenter=show});document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.closest('.row,.tile').classList.add('selected');document.querySelector('.picked').textContent='已选择 '+data[+el.dataset.select][0];});if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');</script></body></html>
