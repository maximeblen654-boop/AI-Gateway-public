name: Native media candidate (no deployment)

on:
  push:
    branches: [codex/studio-native-media]
  workflow_dispatch:
    inputs:
      mode:
        description: 'build a new candidate or accept an existing candidate artifact'
        required: true
        default: build
        type: choice
        options: [build, accept-existing]
      build_source_sha:
        description: 'exact runtime source SHA; empty uses this workflow commit'
        required: false
        default: ''
      build_acceptance:
        description: 'candidate runtime acceptance scope'
        required: false
        type: choice
        default: standard
        options: [standard, draft-management, studio-workspace]
      acceptance_scenario:
        description: 'existing-image acceptance scope'
        required: false
        type: choice
        default: video
        options: [video, draft-diagnostics, draft-management, studio-workspace]
      candidate_run_id:
        description: 'existing candidate run id (accept-existing only)'
        required: false
        default: '38183650939'
      candidate_artifact_name:
        description: 'existing candidate artifact name (accept-existing only)'
        required: false
        default: native-media-candidate-64d9b523520f087cea31a216e7db65e64605ff7b
      candidate_source_sha:
        description: 'source SHA embedded in the existing candidate'
        required: false
        default: 64d9b523520f087cea31a216e7db65e64605ff7b

permissions:
  contents: read
  actions: read

concurrency:
  group: native-media-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.repository == 'maximeblen654-boop/AI-Gateway-public' &&
      github.ref == 'refs/heads/codex/studio-native-media' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'accept-existing') &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-media-candidate]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NATIVE_CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.build_source_sha || github.sha }}
      NATIVE_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/.candidate-runtime
      NATIVE_REUSE_SOURCE_DIR: ${{ github.workspace }}/.candidate-reuse-source
      NATIVE_REUSE_ARTIFACT_DIR: ${{ github.workspace }}/.candidate-reuse-artifact
      NATIVE_ACCEPTANCE_SCENARIO: ${{ github.event.inputs.build_acceptance || 'standard' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout the frozen runtime source separately from acceptance scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.build_source_sha || github.sha }}
          path: .candidate-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: docker/setup-buildx-action@v3
      - name: Checkout the pinned sidecar source for reuse comparison
        if: github.event.inputs.build_acceptance == 'studio-workspace'
        uses: actions/checkout@v6
        with:
          ref: b2fcdac93afa6ae194ee81801a9b37813f8f39eb
          path: .candidate-reuse-source
          persist-credentials: false
      - name: Fetch existing sidecar archives without rebuilding
        if: github.event.inputs.build_acceptance == 'studio-workspace'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38443205417 --repo "$GITHUB_REPOSITORY" \
            --name native-media-candidate-b2fcdac93afa6ae194ee81801a9b37813f8f39eb \
            --dir "$NATIVE_REUSE_ARTIFACT_DIR"
      - name: Build only this commit, using existing component recipes
        id: build
        run: node tools/native-media-e2e/candidate.mjs build
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pnpm --dir frontend install --frozen-lockfile
      - name: Real candidate startup and non-paid business acceptance
        run: node tools/native-media-e2e/candidate.mjs verify
      - name: Export images and exact identities (manifest records acceptance status)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/native-media-e2e/candidate.mjs export
      - name: Save small reports and screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-evidence-${{ github.event.inputs.build_source_sha || github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-candidate-output/*.json
            ${{ runner.temp }}/native-candidate-output/*.png
      - name: Save final candidate and non-secret evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-candidate-${{ github.event.inputs.build_source_sha || github.sha }}
          retention-days: 14
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-candidate-output/*

  accept-existing:
    if: >-
      github.repository == 'maximeblen654-boop/AI-Gateway-public' &&
      github.ref == 'refs/heads/codex/studio-native-media' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'accept-existing'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: docker/setup-buildx-action@v3
      - name: Download the exact existing candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-existing-artifact"
          gh run download "${{ github.event.inputs.candidate_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ github.event.inputs.candidate_artifact_name }}" \
            --dir "$RUNNER_TEMP/native-existing-artifact"
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pnpm --dir frontend install --frozen-lockfile
      - name: Accept the existing candidate without rebuilding
        env:
          NATIVE_CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.candidate_source_sha }}
          NATIVE_ACCEPTANCE_SCENARIO: ${{ github.event.inputs.acceptance_scenario }}
        run: node tools/native-media-e2e/accept-existing.mjs "$RUNNER_TEMP/native-existing-artifact"
      - name: Save small acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-existing-acceptance-${{ github.sha }}
          retention-days: 14
          compression-level: 6
          path: |
            ${{ runner.temp }}/native-existing-acceptance-output/*
