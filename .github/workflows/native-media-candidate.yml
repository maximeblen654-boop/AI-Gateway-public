name: Native media candidate (no deployment)

on:
  push:
    branches: [codex/studio-native-media]
  workflow_dispatch:
    inputs:
      mode:
        description: 'build a new candidate or accept an existing candidate artifact'
        required: true
        default: build
        type: choice
        options: [build, accept-existing, admin-ui-review, admin-candidate]
      build_source_sha:
        description: 'exact runtime source SHA; empty uses this workflow commit'
        required: false
        default: ''
      build_acceptance:
        description: 'candidate runtime acceptance scope'
        required: false
        type: choice
        default: standard
        options: [standard, draft-management, studio-workspace, paid-controls]
      focused_entry:
        description: 'paid-controls: only changed Studio entry and upstream diagnostics; reuse prior funds/scale evidence'
        required: false
        type: boolean
        default: false
      acceptance_scenario:
        description: 'existing-image acceptance scope'
        required: false
        type: choice
        default: video
        options: [video, draft-diagnostics, draft-management, studio-workspace, studio-workspace-artifact, admin-media-candidate-artifact, paid-controls]
      candidate_run_id:
        description: 'existing candidate run id (accept-existing only)'
        required: false
        default: '38183650939'
      candidate_artifact_name:
        description: 'existing candidate artifact name (accept-existing only)'
        required: false
        default: native-media-candidate-64d9b523520f087cea31a216e7db65e64605ff7b
      candidate_source_sha:
        description: 'source SHA embedded in the existing candidate'
        required: false
        default: 64d9b523520f087cea31a216e7db65e64605ff7b

permissions:
  contents: read
  actions: read

concurrency:
  group: native-media-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.repository == 'maximeblen654-boop/AI-Gateway-public' &&
      (github.ref == 'refs/heads/codex/studio-native-media' ||
       (github.ref == 'refs/heads/codex/media-paid-controls' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'build' && github.event.inputs.build_acceptance == 'paid-controls')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'accept-existing') &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-media-candidate]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NATIVE_CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.build_source_sha || github.sha }}
      NATIVE_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/.candidate-runtime
      NATIVE_REUSE_SOURCE_DIR: ${{ github.workspace }}/.candidate-reuse-source
      NATIVE_REUSE_ARTIFACT_DIR: ${{ github.workspace }}/.candidate-reuse-artifact
      NATIVE_FOCUSED_ENTRY: ${{ github.event.inputs.focused_entry || 'false' }}
      NATIVE_ACCEPTANCE_SCENARIO: ${{ github.event.inputs.build_acceptance || 'standard' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout the frozen runtime source separately from acceptance scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.build_source_sha || github.sha }}
          path: .candidate-runtime
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Setup Node.js and restore pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Checkout the pinned sidecar source for reuse comparison
        if: github.event.inputs.build_acceptance == 'studio-workspace'
        uses: actions/checkout@v6
        with:
          ref: b2fcdac93afa6ae194ee81801a9b37813f8f39eb
          path: .candidate-reuse-source
          persist-credentials: false
      - name: Fetch existing sidecar archives without rebuilding
        if: github.event.inputs.build_acceptance == 'studio-workspace'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38443205417 --repo "$GITHUB_REPOSITORY" \
            --name native-media-candidate-b2fcdac93afa6ae194ee81801a9b37813f8f39eb \
            --dir "$NATIVE_REUSE_ARTIFACT_DIR"
      - name: Catalog snapshot fixture regression
        run: node --test tools/native-media-e2e/catalog-fixture.test.cjs
      - name: Build only this commit, using existing component recipes
        id: build
        run: node tools/native-media-e2e/candidate.mjs build
      - uses: actions/setup-go@v6
        if: hashFiles('.candidate-runtime/backend/cmd/media-published-recovery/main.go') != ''
        with:
          go-version-file: .candidate-runtime/backend/go.mod
          cache-dependency-path: .candidate-runtime/backend/go.sum
      - name: Package the pinned one-off recovery tool (never execute against production)
        if: hashFiles('.candidate-runtime/backend/cmd/media-published-recovery/main.go') != ''
        working-directory: .candidate-runtime/backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/native-candidate-output/media-published-recovery" ./cmd/media-published-recovery
          node -e 'const fs=require("fs"),crypto=require("crypto"),p=process.env.RUNNER_TEMP+"/native-candidate-output/";fs.writeFileSync(p+"maintenance-tool.json",JSON.stringify({source_sha:process.env.NATIVE_CANDIDATE_SOURCE_SHA,file:"media-published-recovery",sha256:crypto.createHash("sha256").update(fs.readFileSync(p+"media-published-recovery")).digest("hex"),platform:"linux/amd64",executed_in_production:false},null,2))'
      - name: Check missing FFmpeg and Chinese fonts
        id: system-deps
        shell: bash
        run: |
          missing=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            missing+=(ffmpeg)
          fi
          if ! dpkg-query -W -f='${Status}' fonts-noto-cjk 2>/dev/null | grep -qx 'install ok installed'; then
            missing+=(fonts-noto-cjk)
          fi
          printf 'packages=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
      - name: Update apt metadata for missing system dependencies
        if: steps.system-deps.outputs.packages != ''
        run: sudo apt-get update
      - name: Install missing FFmpeg and Chinese fonts
        if: steps.system-deps.outputs.packages != ''
        env:
          MISSING_PACKAGES: ${{ steps.system-deps.outputs.packages }}
        shell: bash
        run: |
          read -r -a packages <<< "$MISSING_PACKAGES"
          sudo apt-get install -y "${packages[@]}"
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Real candidate startup and non-paid business acceptance
        run: node tools/native-media-e2e/candidate.mjs verify
      - name: Export images and exact identities (manifest records acceptance status)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/native-media-e2e/candidate.mjs export
      - name: Save small reports and screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-evidence-${{ github.event.inputs.build_source_sha || github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-candidate-output/*.json
            ${{ runner.temp }}/native-candidate-output/*.png
            ${{ runner.temp }}/native-candidate-output/*.csv
      - name: Save final candidate and non-secret evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-candidate-${{ github.event.inputs.build_source_sha || github.sha }}
          retention-days: 14
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-candidate-output/*

  accept-existing:
    if: >-
      github.repository == 'maximeblen654-boop/AI-Gateway-public' &&
      (github.ref == 'refs/heads/codex/studio-native-media' ||
       (github.ref == 'refs/heads/codex/admin-media-design-review' &&
        github.event.inputs.acceptance_scenario == 'admin-media-candidate-artifact' &&
        github.event.inputs.candidate_source_sha == '15d09689abc0b7e07269692d50e78f83859d1fb6') ||
       (github.ref == 'refs/heads/codex/media-paid-controls' && github.event.inputs.acceptance_scenario == 'paid-controls')) &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'accept-existing'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Setup Node.js and restore pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Read the frozen runtime source for acceptance applicability
        if: github.event.inputs.acceptance_scenario == 'paid-controls'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.candidate_source_sha }}
          path: .candidate-runtime
          persist-credentials: false
      - name: Download the exact existing candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-existing-artifact"
          gh run download "${{ github.event.inputs.candidate_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ github.event.inputs.candidate_artifact_name }}" \
            --dir "$RUNNER_TEMP/native-existing-artifact"
      - name: Check missing FFmpeg and Chinese fonts
        id: system-deps
        shell: bash
        run: |
          missing=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            missing+=(ffmpeg)
          fi
          if ! dpkg-query -W -f='${Status}' fonts-noto-cjk 2>/dev/null | grep -qx 'install ok installed'; then
            missing+=(fonts-noto-cjk)
          fi
          printf 'packages=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
      - name: Update apt metadata for missing system dependencies
        if: steps.system-deps.outputs.packages != ''
        run: sudo apt-get update
      - name: Install missing FFmpeg and Chinese fonts
        if: steps.system-deps.outputs.packages != ''
        env:
          MISSING_PACKAGES: ${{ steps.system-deps.outputs.packages }}
        shell: bash
        run: |
          read -r -a packages <<< "$MISSING_PACKAGES"
          sudo apt-get install -y "${packages[@]}"
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Catalog snapshot fixture regression
        run: node --test tools/native-media-e2e/catalog-fixture.test.cjs
      - name: Accept the existing candidate without rebuilding
        env:
          NATIVE_CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.candidate_source_sha }}
          NATIVE_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/.candidate-runtime
          NATIVE_ACCEPTANCE_SCENARIO: ${{ github.event.inputs.acceptance_scenario }}
          NATIVE_FOCUSED_ENTRY: ${{ github.event.inputs.focused_entry || 'false' }}
        run: |
          if [ "$NATIVE_ACCEPTANCE_SCENARIO" = paid-controls ]; then
            node tools/native-media-e2e/candidate.mjs load-existing "$RUNNER_TEMP/native-existing-artifact"
            node tools/native-media-e2e/candidate.mjs verify
          elif [ "$NATIVE_ACCEPTANCE_SCENARIO" = studio-workspace-artifact ] || [ "$NATIVE_ACCEPTANCE_SCENARIO" = admin-media-candidate-artifact ]; then
            node tools/native-media-e2e/accept-workspace-artifact.mjs "$RUNNER_TEMP/native-existing-artifact"
          else
            node tools/native-media-e2e/accept-existing.mjs "$RUNNER_TEMP/native-existing-artifact"
          fi
      - name: Save small acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-existing-acceptance-${{ github.sha }}
          retention-days: 14
          compression-level: 6
          path: |
            ${{ runner.temp }}/native-existing-acceptance-output/*
            ${{ runner.temp }}/native-candidate-output/*.json
            ${{ runner.temp }}/native-candidate-output/*.png
            ${{ runner.temp }}/native-candidate-output/*.csv

  admin-ui-review:
    if: >-
      github.repository == 'maximeblen654-boop/AI-Gateway-public' &&
      github.ref == 'refs/heads/codex/admin-media-design-review' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.mode == 'admin-ui-review' || github.event.inputs.mode == 'admin-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NATIVE_ACCEPTANCE_SCENARIO: admin-ui-review
      NATIVE_EXPORT_CANDIDATE: ${{ github.event.inputs.mode == 'admin-candidate' }}
      NATIVE_CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.build_source_sha || github.sha }}
      NATIVE_CANDIDATE_SOURCE_DIR: ${{ github.workspace }}/.review-runtime
      NATIVE_REUSE_SOURCE_DIR: ${{ github.workspace }}/.candidate-reuse-source
      NATIVE_REUSE_ARTIFACT_DIR: ${{ github.workspace }}/.candidate-reuse-artifact
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.build_source_sha || github.sha }}
          path: .review-runtime
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: b2fcdac93afa6ae194ee81801a9b37813f8f39eb
          path: .candidate-reuse-source
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Setup Node.js and restore pnpm store
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Reuse existing sidecars in the isolated stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38443205417 --repo "$GITHUB_REPOSITORY" --name native-media-candidate-b2fcdac93afa6ae194ee81801a9b37813f8f39eb --dir "$NATIVE_REUSE_ARTIFACT_DIR"
      - name: Build the exact Core; preserve existing b2 sidecars
        id: build
        run: node tools/native-media-e2e/candidate.mjs build
      - name: Check missing FFmpeg and Chinese fonts
        id: system-deps
        shell: bash
        run: |
          missing=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            missing+=(ffmpeg)
          fi
          if ! dpkg-query -W -f='${Status}' fonts-noto-cjk 2>/dev/null | grep -qx 'install ok installed'; then
            missing+=(fonts-noto-cjk)
          fi
          printf 'packages=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
      - name: Update apt metadata for missing system dependencies
        if: steps.system-deps.outputs.packages != ''
        run: sudo apt-get update
      - name: Install missing FFmpeg and Chinese fonts
        if: steps.system-deps.outputs.packages != ''
        env:
          MISSING_PACKAGES: ${{ steps.system-deps.outputs.packages }}
        shell: bash
        run: |
          read -r -a packages <<< "$MISSING_PACKAGES"
          sudo apt-get install -y "${packages[@]}"
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Actual Vue and isolated backend integration
        run: node tools/native-media-e2e/candidate.mjs verify
      - name: Export the candidate without rebuilding sidecars
        if: ${{ !cancelled() && github.event.inputs.mode == 'admin-candidate' && steps.build.outcome == 'success' }}
        run: node tools/native-media-e2e/candidate.mjs export
      - name: Preserve small review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-implementation-review-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-candidate-output/*.json
            ${{ runner.temp }}/native-candidate-output/*.png
            ${{ runner.temp }}/native-candidate-output/*.csv

      - name: Preserve one complete candidate
        if: ${{ !cancelled() && github.event.inputs.mode == 'admin-candidate' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-media-candidate-${{ github.event.inputs.build_source_sha || github.sha }}
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/native-candidate-output/*
