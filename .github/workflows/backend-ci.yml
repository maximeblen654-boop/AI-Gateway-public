name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install local media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Historical receipt maintenance offline checks
        run: python3 -B -m unittest discover -s tools/maintenance -v
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

      - name: Isolated product wizard browser acceptance
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.media.config.ts wizard.spec.ts product-management.spec.ts cost-calculator.spec.ts media-limits.spec.ts video-polish.spec.ts diagnostic-navigation.spec.ts acceptance-script.spec.ts media-types.spec.ts

      - name: Isolated procurement, publication and Account sales browser acceptance
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.procurement.config.ts

      - name: Upload isolated wizard screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-wizard-browser-evidence
          path: |
            frontend/test-results/media-workbench/
            frontend/test-results/workbench-procurement/
          retention-days: 14

      - name: Synthetic usage display fixture regression
        working-directory: frontend
        run: pnpm exec vitest run src/__tests__/integration/usage-reasoning-effort.spec.ts

      - name: Local fixture isolation checks
        run: node --test tools/phase5-media-e2e/fixture-config.test.cjs tools/native-media-e2e/admin-readonly.test.cjs

      - name: Published media BFF contract tests (no supplier calls)
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node --test studio/bff/video-assets.test.mjs studio/bff/plan-a-isolation.test.mjs studio/bff/asset-intake.test.mjs studio/bff/image-binding.test.mjs studio/bff/legacy-runtime.test.mjs studio/api/video-plan.test.mjs studio/bff/video-account.test.mjs studio/bff/video-handler.test.mjs studio/bff/video-result-spec.test.mjs

  plan-b-viewport-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/media-paid-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Render final Plan B viewport screenshots
        run: |
          pnpm --dir frontend exec playwright test tests/studio-workspace/workspace.spec.ts \
            --config=tests/studio-workspace/playwright.config.ts \
            --grep "Plan B creation and archive surfaces" \
            --reporter=line
          node -e 'const fs=require("fs");fs.writeFileSync("frontend/test-results/plan-b-viewport-evidence.json",JSON.stringify({source_sha:process.env.SOURCE_SHA,viewport_screenshots:true,test_command:"playwright test tests/studio-workspace/workspace.spec.ts --grep Plan B creation and archive surfaces",generated_at:new Date().toISOString()},null,2))'
      - name: Verify local image export in Chromium
        run: |
          pnpm --dir frontend exec playwright test tests/studio-workspace/image-export.spec.ts tests/studio-workspace/native-output-format.spec.ts tests/studio-workspace/published-ratios.spec.ts --config=playwright.studio.config.ts --output=test-results/image-export --reporter=line
      - name: Upload final viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-viewport-evidence-${{ env.SOURCE_SHA }}
          retention-days: 14
          compression-level: 6
          path: |
            frontend/test-results/workspace-Plan-B-creation-and-archive-surfaces-*/*-viewport-*.png
            frontend/test-results/plan-b-viewport-evidence.json
            frontend/test-results/image-export/**/*.png

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
