name: plan-b-viewport-evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact Vue source commit to render and test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  viewport-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Vue source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Render real viewport screenshots
        run: |
          pnpm --dir frontend exec playwright test tests/studio-workspace/workspace.spec.ts \
            --config=tests/studio-workspace/playwright.config.ts \
            --grep "Plan B creation and archive surfaces" \
            --reporter=line
          node -e 'const fs=require("fs");const source=process.env.SOURCE_SHA;const out="frontend/test-results/plan-b-viewport-evidence.json";fs.writeFileSync(out,JSON.stringify({source_sha:source,viewport_screenshots:true,test_command:"playwright test tests/studio-workspace/workspace.spec.ts --grep Plan B creation and archive surfaces",generated_at:new Date().toISOString()},null,2))' 
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Upload final viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-b-viewport-evidence-${{ inputs.source_sha }}
          retention-days: 14
          compression-level: 6
          path: |
            frontend/test-results/workspace-Plan-B-creation-and-archive-surfaces-*/*-viewport-*.png
            frontend/test-results/plan-b-viewport-evidence.json
